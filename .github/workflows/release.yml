# .github/workflows/release.yml
#
# Adapted from upstream bitloops for the research fork.
# Changes vs upstream: self-hosted -> ubuntu-latest; Apple signing/notarization,
# Homebrew tap job, Slack notification and the "Production CLI" environment all
# removed; build version/commit/target/date stamped; binary renamed.
#
# To change the binary name, edit BIN_NAME below and run the same rename across
# bitloops/Cargo.toml ([[bin]] name) and the six agent hook source files.

name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (for manual test runs)"
        required: true

permissions:
  contents: write

env:
  BIN_NAME: cycloops

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: windows-latest
            target: aarch64-pc-windows-msvc

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # --- Build metadata -------------------------------------------------
      # build.rs reads these; cli/root/build.rs exposes them via option_env!.
      # Without them a release binary reports version "dev".
      - name: Compute build metadata
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
          fi
          {
            echo "BITLOOPS_BUILD_VERSION=${TAG#v}"
            echo "BITLOOPS_BUILD_COMMIT=$(git rev-parse --short HEAD)"
            echo "BITLOOPS_BUILD_TARGET=${{ matrix.target }}"
            echo "BITLOOPS_BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "RELEASE_TAG=${TAG}"
          } >> "$GITHUB_ENV"

      - name: Install cross
        if: ${{ contains(matrix.target, 'unknown-linux-musl') }}
        run: cargo install cross --locked

      - name: Install musl-tools
        if: contains(matrix.target, 'unknown-linux-musl')
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Install qemu for Linux arm64 smoke test
        if: matrix.target == 'aarch64-unknown-linux-musl'
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-user

      - name: Configure Windows arm64 linker
        if: matrix.target == 'aarch64-pc-windows-msvc'
        shell: pwsh
        run: |
          "CARGO_TARGET_AARCH64_PC_WINDOWS_MSVC_LINKER=rust-lld" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build (musl targets)
        if: ${{ contains(matrix.target, 'unknown-linux-musl') }}
        env:
          DUCKDB_DOWNLOAD_LIB: "0"
        run: cross build --release --target ${{ matrix.target }} -p bitloops --features duckdb-bundled

      - name: Build (macOS targets)
        if: runner.os == 'macOS'
        env:
          LZMA_API_STATIC: "1"
          DUCKDB_DOWNLOAD_LIB: "0"
        run: cargo build --release --target ${{ matrix.target }} -p bitloops --features duckdb-bundled

      - name: Build (Windows targets)
        if: runner.os == 'Windows'
        env:
          DUCKDB_DOWNLOAD_LIB: "1"
        run: cargo build --release --target ${{ matrix.target }} -p bitloops

      - name: Stage DuckDB runtime (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $binDir = "target/${{ matrix.target }}/release"
          $dll = Join-Path $binDir "deps/duckdb.dll"
          if (-not (Test-Path $dll)) { throw "Missing expected DuckDB runtime: $dll" }
          Copy-Item $dll (Join-Path $binDir "duckdb.dll") -Force

      - name: Validate macOS runtime linkage
        if: runner.os == 'macOS'
        run: |
          bin="target/${{ matrix.target }}/release/${BIN_NAME}"
          links="$(otool -L "$bin")"
          echo "$links"
          if printf '%s\n' "$links" | grep '@rpath/libduckdb.dylib' >/dev/null; then
            echo "Release binary should not depend on an external DuckDB dylib" >&2
            exit 1
          fi
          if printf '%s\n' "$links" | grep -E '/opt/homebrew|/usr/local/(Cellar|opt)' >/dev/null; then
            echo "Unexpected non-system macOS dylib dependency detected in $bin" >&2
            exit 1
          fi

      # --- Ad-hoc signing (no Apple Developer account) ---------------------
      # Upstream signs with a real identity and notarizes. We cannot, so we
      # ad-hoc sign: this makes the binary runnable once the install script
      # strips the quarantine attribute. It does NOT satisfy Gatekeeper for
      # a double-clicked download.
      - name: Ad-hoc sign macOS binary
        if: runner.os == 'macOS'
        run: |
          codesign --force --sign - "target/${{ matrix.target }}/release/${BIN_NAME}"
          codesign --verify --verbose=2 "target/${{ matrix.target }}/release/${BIN_NAME}"

      - name: Smoke test (Unix)
        if: runner.os != 'Windows' && matrix.target != 'aarch64-unknown-linux-musl'
        run: ./target/${{ matrix.target }}/release/${BIN_NAME} --version

      - name: Smoke test (Linux arm64 via qemu)
        if: matrix.target == 'aarch64-unknown-linux-musl'
        run: qemu-aarch64 ./target/${{ matrix.target }}/release/${BIN_NAME} --version

      - name: Smoke test (Windows x64)
        if: matrix.target == 'x86_64-pc-windows-msvc'
        shell: pwsh
        run: |
          & "target/${{ matrix.target }}/release/$env:BIN_NAME.exe" --version

      - name: Validate Windows arm64 build output
        if: matrix.target == 'aarch64-pc-windows-msvc'
        shell: pwsh
        run: |
          $binDir = "target/${{ matrix.target }}/release"
          if (-not (Test-Path (Join-Path $binDir "$env:BIN_NAME.exe"))) { throw "Missing binary" }
          if (-not (Test-Path (Join-Path $binDir "duckdb.dll"))) { throw "Missing DuckDB runtime" }

      # --- Packaging -------------------------------------------------------
      # All archives place their payload at the archive ROOT (no nested
      # directory). Upstream's macOS zip nested everything under package/,
      # which complicates the install script for no benefit.
      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist
          tar -C "target/${{ matrix.target }}/release" \
              -czf "dist/${BIN_NAME}-${{ matrix.target }}.tar.gz" "${BIN_NAME}"

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir -p dist
          ditto -c -k --keepParent \
            "target/${{ matrix.target }}/release/${BIN_NAME}" \
            "dist/${BIN_NAME}-${{ matrix.target }}.zip"

      - name: Verify packaged macOS archive
        if: runner.os == 'macOS'
        run: |
          tmpdir="$(mktemp -d)"
          trap 'rm -rf "$tmpdir"' EXIT
          ditto -x -k "dist/${BIN_NAME}-${{ matrix.target }}.zip" "$tmpdir"
          test -f "$tmpdir/${BIN_NAME}"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist/package -Force | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/$env:BIN_NAME.exe" "dist/package/$env:BIN_NAME.exe" -Force
          Copy-Item "target/${{ matrix.target }}/release/duckdb.dll" "dist/package/duckdb.dll" -Force
          Compress-Archive -Path dist/package/* -DestinationPath "dist/$env:BIN_NAME-${{ matrix.target }}.zip"

      - name: Upload build artifact
        uses: actions/upload-artifact@v6
        with:
          name: release-${{ matrix.target }}
          path: dist/${{ env.BIN_NAME }}-${{ matrix.target }}.*

  publish:
    name: Publish release
    runs-on: ubuntu-latest
    needs: build
    # workflow_dispatch runs exist to exercise the build matrix only;
    # there is no tag to publish to or verify against.
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download packaged artifacts
        uses: actions/download-artifact@v6
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd dist
          sha256sum ${BIN_NAME}-* > checksums-sha256.txt
          cat checksums-sha256.txt

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/${{ env.BIN_NAME }}-*
            dist/checksums-sha256.txt

  verify:
    name: Verify published release artifacts
    runs-on: ubuntu-latest
    needs: publish
    # workflow_dispatch runs exist to exercise the build matrix only;
    # there is no tag to publish to or verify against.
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download assets from published release
        env:
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          mkdir -p verify && cd verify
          assets=(
            ${BIN_NAME}-aarch64-apple-darwin.zip
            ${BIN_NAME}-x86_64-apple-darwin.zip
            ${BIN_NAME}-x86_64-unknown-linux-musl.tar.gz
            ${BIN_NAME}-aarch64-unknown-linux-musl.tar.gz
            ${BIN_NAME}-x86_64-pc-windows-msvc.zip
            ${BIN_NAME}-aarch64-pc-windows-msvc.zip
            checksums-sha256.txt
          )
          for asset in "${assets[@]}"; do
            curl -fL -o "$asset" "https://github.com/${REPO}/releases/download/${TAG}/${asset}"
          done

      - name: Verify checksums
        run: cd verify && sha256sum -c checksums-sha256.txt

      - name: Smoke test linux release binary
        run: |
          cd verify
          tar -xzf ${BIN_NAME}-x86_64-unknown-linux-musl.tar.gz
          chmod +x ${BIN_NAME}
          ./${BIN_NAME} --version

      - name: Smoke test linux arm64 release binary via qemu
        run: |
          sudo apt-get update && sudo apt-get install -y qemu-user
          cd verify && mkdir -p arm64
          tar -xzf ${BIN_NAME}-aarch64-unknown-linux-musl.tar.gz -C arm64
          chmod +x arm64/${BIN_NAME}
          qemu-aarch64 arm64/${BIN_NAME} --version
