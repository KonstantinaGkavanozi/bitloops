# .github/workflows/ci.yml
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Use the prebuilt DuckDB library rather than compiling its C++ sources.
  # Building bundled on a 2-core runner takes far longer than the tests do.
  DUCKDB_DOWNLOAD_LIB: "1"

jobs:
  test:
    name: Build and test (Ubuntu)
    runs-on: ubuntu-latest
    # A cold run compiles DuckDB and six test binaries before ~900s of tests.
    # Generous until the cache is warm; drop it once runs are a few minutes.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6

      # Windows PowerShell 5.1 reads a BOM-less file as CP1252, which turns a
      # UTF-8 em dash into a smart quote - and PowerShell treats smart quotes
      # as string delimiters, so one comment can make the whole script fail to
      # parse. Keeping the installers ASCII removes the class of bug.
      - name: Installers must be ASCII
        run: |
          status=0
          for f in install.sh install.ps1 scripts/install.sh scripts/install.ps1; do
            [ -f "$f" ] || continue
            if LC_ALL=C grep -nP '[^\x00-\x7F]' "$f"; then
              echo "^ $f contains non-ASCII characters" >&2
              status=1
            fi
          done
          exit $status

      - uses: dtolnay/rust-toolchain@1.95.0

      - uses: taiki-e/install-action@nextest

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
          shared-key: ci
          cache-workspace-crates: true
          # Without this the cache is only written when the whole job passes,
          # so a red test run leaves the next run compiling from scratch — and
          # a slow cold run is what makes the job time out in the first place.
          cache-on-failure: true

      # Catches anything that breaks the binary target itself — the bin name in
      # build.rs link args, CARGO_BIN_EXE_*, and so on.
      - name: Build the CLI
        run: cargo build -p bitloops

      # DUCKDB_DOWNLOAD_LIB fetches a prebuilt libduckdb.so, but build.rs only
      # emits rpath entries on macOS, so nothing tells the Linux binary where
      # it is. The integration tests spawn the binary too, so this has to be
      # set for the whole job, not just the smoke step.
      - name: Locate the DuckDB runtime
        run: |
          lib="$(find target -name 'libduckdb.so*' -print -quit)"
          if [ -z "$lib" ]; then
            echo "libduckdb.so not found under target/" >&2
            find target -name 'libduckdb*' -print >&2 || true
            exit 1
          fi
          echo "Found $lib"
          echo "LD_LIBRARY_PATH=$(cd "$(dirname "$lib")" && pwd)${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" >> "$GITHUB_ENV"

      - name: Smoke test
        run: ./target/debug/cycloops --version

      # The ci profile in .config/nextest.toml serialises the env-mutating and
      # qat test groups, which are not safe to run in parallel.
      # Two upstream tests assume a machine bigger than a GitHub runner:
      #
      #   execute_sync_with_stats_reports_batched_sqlite_writes asserts
      #     prepare_worker_count == paths_added.min(8), but the value is
      #     available_parallelism().clamp(2, 8) — 2 here.
      #
      #   generic_workplane_claim_does_not_wait_for_write_lock... gives a
      #     worker thread a 250ms wall-clock deadline, which is not reliable
      #     with 6 test threads on 2 cores.
      #
      # Neither touches anything this fork changed. Run them locally on a
      # machine with 8 or more cores.
      - name: Run tests
        run: |
          cargo nextest run -p bitloops --profile ci -E '
            all()
            - test(=host::devql::sync_tests::execute_sync_modes::execute_sync_with_stats_reports_batched_sqlite_writes)
            - test(=daemon::enrichment::tests::generic_workplane_claim_does_not_wait_for_write_lock_when_only_blocked_jobs_exist)
          '

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: junit
          path: target/nextest/ci/junit.xml
          if-no-files-found: ignore
